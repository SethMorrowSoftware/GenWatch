name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check genwatch/ tests/
      - name: Tests (pytest)
        run: python -m pytest tests/ -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # --ignore-scripts mirrors the production install (install.sh): refuse to
      # drift from the committed lockfile and block postinstall scripts.
      - name: Install (locked, no scripts)
        run: npm ci --ignore-scripts
      # `npm run build` is `tsc --noEmit && vite build` — catches TS/Vite breakage.
      - name: Build
        run: npm run build

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      # Audit the pinned, hash-locked backend deps against the live advisory DB.
      # Intentionally unpinned pip-audit so newly disclosed CVEs in the pinned
      # set surface here (supply-chain drift detection).
      - name: Audit backend lockfile (pip-audit)
        run: pip-audit -r backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend runtime deps (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev
