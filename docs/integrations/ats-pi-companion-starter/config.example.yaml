# ATS-Pi companion service configuration
#
# Install:
#   sudo mkdir -p /etc/atspi
#   sudo cp config.example.yaml /etc/atspi/config.yaml
#   sudo nano /etc/atspi/config.yaml
#
# See README.md for setup and docs/SPEC.md for behaviour.

# ─── Modbus TCP server (the interface GenWatch reads) ─────────────────────
# Bind address and port for the inbound Modbus TCP server.
#
# `host`: 0.0.0.0 listens on all interfaces. PREFER the specific IP of
#   your OT-VLAN interface so the service isn't exposed on the building
#   LAN or any Wi-Fi network. Modbus TCP has no built-in authentication
#   — anyone who can reach this port can issue cmd_test, cmd_inhibit,
#   cmd_force_transfer, etc. Firewall it to just the GenWatch Pi's IP.
#
# `port`: 5020 (default) is a high port that doesn't require root to
#   bind, so the systemd unit can run as the unprivileged `atspi` user
#   without granting CAP_NET_BIND_SERVICE. Port 502 is the Modbus TCP
#   convention — if you switch to 502, also grant the bind capability
#   in atspi.service (see comment there). The starter defaults to 5020
#   to make the secure path the easy path; configure GenWatch's
#   ats.tcp.port to match.
modbus_server:
  host: 0.0.0.0
  port: 5020
  unit_id: 1

# ─── I/O driver (the physical interface to the ASCO) ──────────────────────
# driver: 'mock'  — no hardware; for dev/CI and integration testing
#         'adam'  — Advantech ADAM-6060 on Modbus TCP (production)
io:
  driver: mock

  # Used when driver: adam
  adam:
    host: 192.168.1.251
    port: 502
    unit_id: 1

# ─── Site identification ──────────────────────────────────────────────────
# Reported via the ats_pi_unit_id register (ICD §5.4). GenWatch's
# expected_unit_id sanity check compares against this value.
site:
  unit_id: 23

# ─── Persistence ──────────────────────────────────────────────────────────
# The transfer_count_lifetime counter MUST survive reboots per ICD §9.3.
persistence:
  state_file: /var/lib/atspi/state.json
